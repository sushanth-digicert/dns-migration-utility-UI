<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Brand background — matches sidebar brand icon -->
  <rect width="32" height="32" rx="7" fill="#1e4db7"/>

  <!-- DNS record lines (source) -->
  <rect x="3"  y="8"  width="12" height="2.2" rx="1.1" fill="white" opacity="0.95"/>
  <rect x="3"  y="12" width="9"  height="2.2" rx="1.1" fill="white" opacity="0.85"/>
  <rect x="3"  y="16" width="12" height="2.2" rx="1.1" fill="white" opacity="0.95"/>
  <rect x="3"  y="20" width="7"  height="2.2" rx="1.1" fill="white" opacity="0.75"/>

